<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بستان الحروف — إعداد إزونطار يسرا</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b2fb5">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<style>
@font-face{font-family:"Amiri";src:url("fonts/Amiri-Regular.ttf");font-weight:400}
@font-face{font-family:"Amiri";src:url("fonts/Amiri-Bold.ttf");font-weight:700}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Amiri",serif;color:#2b2340;background:linear-gradient(170deg,#2a1873 0%,#5a32d6 55%,#ff8fa3 120%);display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:420px;background:#fffdf8;border-radius:26px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
.logo{width:96px;height:96px;border-radius:24px}
h1{margin:6px 0 0;font-size:44px;color:#4b2fb5;line-height:1.3}
.by{color:#7b6aa8;font-size:18px;margin-bottom:16px}
label{display:block;text-align:right;font-weight:700;font-size:18px;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:20px;padding:8px 14px;border-radius:14px;border:2px solid #d6ccff;background:#fff;direction:ltr;text-align:center}
input:focus{outline:none;border-color:#7c5cff}
button{width:100%;margin-top:18px;font:inherit;font-size:24px;font-weight:700;border:0;border-radius:16px;padding:6px;background:#7c5cff;color:#fff;cursor:pointer;box-shadow:0 5px 0 #4b2fb5}
button:disabled{opacity:.6}
.msg{min-height:1.6em;margin-top:10px;font-size:18px;font-weight:700}
.msg.err{color:#d93636}.msg.ok{color:#0f766e}
.help{font-size:15px;color:#7b6aa8;margin-top:14px;line-height:1.7}
</style></head><body>
<div class="box" id="box">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>بستان الحروف</h1>
  <div class="by">إعداد: إزونطار يسرا</div>
  <form id="f">
    <label for="em">البريد الإلكتروني</label>
    <input id="em" type="email" autocomplete="email" required placeholder="name@gmail.com">
    <label for="cd">كود الدخول</label>
    <input id="cd" type="text" autocomplete="off" required placeholder="XXXX-XXXX" style="text-transform:uppercase;letter-spacing:3px">
    <button id="go" type="submit">📖 افتح الكتاب</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="help">الكود يصلك على بريدك الإلكتروني بعد الشراء.<br>الكود شخصي ويعمل على عدد محدود من الأجهزة.</div>
</div>
<script>
(function(){
  var LS = "bustan_license";
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  function say(t, cls){ msg.textContent = t; msg.className = "msg " + (cls || ""); }
  function get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function del(k){ try { localStorage.removeItem(k); } catch(e){} }
  function device(){
    var d = null; try { d = localStorage.getItem("bustan_device"); } catch(e){}
    if (!d){ d = "D" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { localStorage.setItem("bustan_device", d); } catch(e){} }
    return d;
  }
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  async function check(email, code){
    var url = window.BUSTAN_API + "?action=unlock&email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code) + "&device=" + encodeURIComponent(device());
    var r = await fetch(url, {redirect: "follow"});
    return await r.json();
  }

  async function openBook(lic){
    say("⏳ جارٍ فتح الكتاب…", "ok");
    var enc = await (await fetch("book.enc", {cache: "no-cache"})).json();
    var key = await crypto.subtle.importKey("raw", b64(lic.key), "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(enc.iv)}, key, b64(enc.ct));
    var html = new TextDecoder().decode(plain);
    var wmSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'><text x='20' y='120' transform='rotate(-25 160 100)' font-size='18' font-family='sans-serif' fill='%234b2fb5'>" + esc(lic.email) + "</text></svg>";
    var guard = '<div id="wm" style="background-image:url(&quot;data:image/svg+xml;utf8,' + wmSvg.replace(/"/g, "'").replace(/#/g, "%23") + '&quot;)"></div>' +
      '<script>(function(){document.addEventListener("contextmenu",function(e){e.preventDefault();});' +
      'document.addEventListener("keydown",function(e){var k=(e.key||"").toLowerCase();if((e.ctrlKey||e.metaKey)&&(k==="s"||k==="p"||k==="u")){e.preventDefault();}});' +
      'document.addEventListener("dragstart",function(e){e.preventDefault();});' +
      'if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}})();<\/script>';
    html = html.replace("<!--WM-->", guard);
    document.open(); document.write(html); document.close();
  }

  async function start(email, code, fromForm){
    go.disabled = true;
    try {
      var saved = get(LS);
      // Offline / recent activation on this device
      if (!fromForm && saved && saved.exp > Date.now()) { await openBook(saved); return; }
      if (!window.BUSTAN_API || window.BUSTAN_API.indexOf("http") !== 0) { say("⚠️ لم يُضبط رابط التحقق في config.js", "err"); return; }
      say("⏳ جارٍ التحقق…", "ok");
      var res = await check(email, code);
      if (!res.ok) { del(LS); say("❌ " + (res.msg || "تعذّر التحقق"), "err"); return; }
      var lic = {email: email, code: code, key: res.key, exp: Date.now() + (res.days || 7) * 864e5};
      put(LS, lic);
      await openBook(lic);
    } catch (e) {
      var saved2 = get(LS);
      if (saved2 && saved2.key && saved2.exp + 23 * 864e5 > Date.now()) { await openBook(saved2); return; } // no internet: up to 30 days after the last check
      say("❌ تعذّر الاتصال. تأكد من الإنترنت ثم أعد المحاولة.", "err");
    } finally { go.disabled = false; }
  }

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("em").value.trim().toLowerCase();
    var code = document.getElementById("cd").value.trim().toUpperCase();
    start(email, code, true);
  });

  var saved = get(LS);
  if (saved && saved.email) {
    document.getElementById("em").value = saved.email;
    document.getElementById("cd").value = saved.code || "";
    if (saved.exp > Date.now()) start(saved.email, saved.code, false);
    else if (navigator.onLine) start(saved.email, saved.code, true);   // weekly re-check with the server
  }
})();
</script>
</body></html>
